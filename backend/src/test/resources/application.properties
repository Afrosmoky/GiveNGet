server.host=localhost
db.port=3306
db.url=jdbc:mysql://${server.host}:${db.port}/gng
db.name=gng
spring.datasource.url=jdbc:mysql://${server.host}:${db.port}/${db.name}
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
show.sql=false

liquibase.url=${db.url}

port=8080

# Bez wildcardu — StartupConfigurationCheck odrzuca '*' na starcie aplikacji
cors.allowed-origins=http://localhost:3000

# Atrapy sekretów dla testów. Kontekst testowy nie wysyła maili ani nie woła Geoapify,
# ale placeholdery w application-*.properties muszą mieć czym się rozwiązać,
# gdyby jakiś test uruchomił pełny kontekst aplikacji.
jwt.secret=testoweSekretneHasloDlaTestowJWT0123456789
jwt.expiration=10800000
smtp.username=test@example.com
spring.mail.username=test@example.com
spring.mail.password=test
geoapify.api.key=test-geoapify-key
geoapify.api.base-url=https://api.geoapify.com/v1
front.app.url=http://localhost:3000
file.storage.base-path=./target/test-uploads
file.storage.images.path=./target/test-uploads/images
terms.current-version=1.0
