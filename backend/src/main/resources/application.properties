spring.profiles.active=local
# Dozwolone originy CORS — lista po przecinku, nadpisywana zmienną CORS_ALLOWED_ORIGINS.
# Jedno źródło prawdy dla SecurityConfig i WebSocketConfig (patrz CorsProperties).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.resources.static-locations=classpath:/static/,file:/path/do/twojego/katalogu/backend/uploads/

# Import ofert z Excela (docs/08, pozycja 1). Limit pliku musi być mniejszy niż
# spring.servlet.multipart.max-file-size, inaczej żądanie odrzuci już Spring, poza formatem 6.3.
offer-import.max-file-size=2MB
offer-import.max-rows=500

# Obowiązująca wersja regulaminu — zapisywana na koncie przy rejestracji (docs/08, pozycja 2).
# Podbić przy każdej zmianie treści regulaminu.
terms.current-version=${TERMS_CURRENT_VERSION:1.0}
