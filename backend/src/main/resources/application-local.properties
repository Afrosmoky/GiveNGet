server.host=localhost
server.port=8080
db.port=3306
db.name=gng
spring.datasource.url=jdbc:mysql://${server.host}:${db.port}/${db.name}
spring.datasource.username=${DB_USERNAME:user}
# Lokalna baza z docker-compose — wartość domyślna celowo,
# żeby `mvn spring-boot:run` działał bez eksportowania zmiennych.
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
show.sql=false

security.enabled=true

liquibase.url = ${spring.datasource.url}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#server.servlet.context-path=/gng

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

front.app.url=http://localhost:3000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT Configuration
# ─────────────────────────────────────────────────────────────
#  SEKRETY — wyłącznie ze zmiennych środowiskowych.
#  Brak zmiennej = aplikacja NIE wstaje (placeholder bez wartości domyślnej).
#  Zmienna pusta = StartupConfigurationCheck przerywa start z komunikatem.
#  Lista wymaganych zmiennych: .env.example w katalogu głównym repo.
# ─────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=10800000

# File Storage Configuration
file.storage.base-path=./uploads
file.storage.images.path=${file.storage.base-path}/images
file.storage.max-file-size=5MB

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Logging configuration
logging.level.com.example.gng.auth.filter.JwtAuthenticationFilter=DEBUG
logging.level.com.example.gng.auth.service.SessionService=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.gng.user.controller.RegistrationController=DEBUG
logging.level.com.example.gng.offer.controller.OfferController=DEBUG
logging.level.org.springframework.web=DEBUG
# Procesory ciał żądań/odpowiedzi logują na DEBUG cały obiekt (toString) albo surowy String —
# np. nowe hasło w POST /api/reset-password/{code}. Hasła nie mogą trafiać do logów, więc ten
# jeden logger trzymamy na INFO; reszta org.springframework.web zostaje na DEBUG.
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
logging.level.org.springframework.validation=DEBUG

# Geoapify Configuration
geoapify.api.key=${GEOAPIFY_KEY}
geoapify.api.base-url=https://api.geoapify.com/v1

# Rezerwacje
# Czas życia holdu rezerwacji w godzinach (docs/04_REZERWACJE_DESIGN.md, sekcja 5)
reservation.hold-ttl-hours=24

# Raport oszczędności — współczynniki szacunkowe (docs/01_MVP_ZAKRES.md)
# Stałe na sztukę, identyczne dla każdego produktu; DTO oznacza wyniki jako estimated=true
report.avg-weight-kg-per-unit=0.4
report.co2-factor-kg-per-kg=2.5

# ── Limity tempa żądań (hardening) ────────────────────────────
# UWAGA: licznik jest w pamięci procesu — działa dla JEDNEJ instancji aplikacji.
# Przy skalowaniu poziomym efektywny limit rośnie liniowo z liczbą instancji;
# wtedy potrzebny Redis (dług po pilotażu, docs/05).
ratelimit.reservation-create.capacity=${RATELIMIT_RESERVATION_CREATE_CAPACITY:10}
ratelimit.reservation-create.period=${RATELIMIT_RESERVATION_CREATE_PERIOD:PT1H}
ratelimit.reservation-collect.capacity=${RATELIMIT_RESERVATION_COLLECT_CAPACITY:30}
ratelimit.reservation-collect.period=${RATELIMIT_RESERVATION_COLLECT_PERIOD:PT1M}
ratelimit.login.capacity=${RATELIMIT_LOGIN_CAPACITY:10}
ratelimit.login.period=${RATELIMIT_LOGIN_PERIOD:PT1M}

# Twardy limit jednocześnie aktywnych rezerwacji na użytkownika (anty-abuse, no-showy)
reservation.max-active-per-user=${RESERVATION_MAX_ACTIVE_PER_USER:5}
