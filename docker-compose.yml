version: '3.8'

# ─────────────────────────────────────────────────────────────
#  GiveNGet — pełny stack (MySQL + Backend + Frontend)
#
#  Demo (VPS):   cp .env.demo .env && docker compose up -d --build
#  Lokalnie:     cp .env.local .env && docker compose up -d --build
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL 8 ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gng-mysql
    restart: always
    environment:
      # Hasła z .env. Wartości domyślne są JAWNIE lokalne i nie są sekretami —
      # poprzednie domyślne to były prawdziwe hasła VPS-a w commitowanym pliku.
      # Na pilotażu ustaw MYSQL_ROOT_PASSWORD i DB_PASSWORD w .env.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-not-a-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gngdev}
      MYSQL_USER: ${DB_USERNAME:-gnguser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-not-a-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - gng-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Backend (Spring Boot) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: gng-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Nadpisuje server.host=localhost z application-dev.properties
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gngdev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-gnguser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local-not-a-secret}
      # URL frontendu — używany w linkach w mailach (aktywacja, reset hasła)
      FRONT_APP_URL: ${FRONT_APP_URL:-http://localhost:3000}
      # CORS — jedna lista originów dla HTTP i WebSocket (patrz CorsProperties).
      # Bez wartości domyślnej z FRONT_APP_URL: origin frontendu i lista CORS to dwie
      # różne decyzje (np. panel pracownika może chodzić pod innym adresem).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # ── Sekrety. Brak którejkolwiek = backend nie wstanie (celowo).
      #    Pełny opis w .env.example.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET jest wymagany - uzupelnij .env}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME jest wymagany - uzupelnij .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD jest wymagany - uzupelnij .env}
      GEOAPIFY_KEY: ${GEOAPIFY_KEY:?GEOAPIFY_KEY jest wymagany - uzupelnij .env}
      # Credentiale bazy — muszą zgadzać się z sekcją mysql poniżej
      DB_USERNAME: ${DB_USERNAME:-gnguser}
      DB_PASSWORD: ${DB_PASSWORD:-local-not-a-secret}
    ports:
      - "8080:8080"
    volumes:
      # Persystencja uploadowanych zdjęć między restartami kontenera
      - uploads-data:/app/uploads
    networks:
      - gng-net

  # ── Frontend (Next.js) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_API_URL jest "wypalany" w bundle podczas budowania!
        # Zmiana URL = trzeba przebudować obraz (docker compose up -d --build frontend)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-production}
    container_name: gng-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - gng-net

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mysql-data:
    driver: local
  uploads-data:
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  gng-net:
    driver: bridge
